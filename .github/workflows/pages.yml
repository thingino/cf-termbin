name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # API_BASE stays empty: the Worker proxies this site at /admin/ on its own origin, so
      # the API is same-origin and the bin's hostname appears nowhere here. What the deploy
      # is actually for is the version and short sha behind the shared footer.
      - name: Stamp the build into config.js
        run: |
          cat > web/config.js <<CFG
          window.API_BASE = "";
          window.AUTH_ORIGIN = "https://thingino-image-builder-1d2e9b23.thingino.workers.dev";
          window.APP_VERSION = "$(node -p "require('./package.json').version")";
          window.GIT_SHA = "$(git rev-parse --short=7 HEAD)";
          CFG
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
